# Пример конфигурации VoiceControl (этап 1).
# Запуск: python -m voicecontrol.main --config config.toml
# Формат по умолчанию — TOML; также принимается JSON (config.json) для совместимости.
#
# ВАЖНО: значения безопасны по умолчанию — белый список приложений и
# разрешённые директории пусты: действия ОС остаются недоступными, пока вы
# явно не перечислите разрешённые пути (этапы 3).

# ---- Общие ----
run_mode = "production"        # "production" (по умолчанию) | "test" (явно включаемые тестовые адаптеры)
language = "ru"                # основной язык: "ru" | "de"
additional_languages = []      # дополнительные языки ответов/распознавания, подмножество ["ru", "de"]
wake_phrase = "voice control"  # ключевая фраза активации

# ---- Микрофон ----
[audio]
sample_rate = 16000            # одна из: 8000, 16000, 22050, 44100, 48000
chunk_size = 1024              # 128..8192
channels = 1                   # 1 = моно (формат AudioSegment), 2 = стерео
# device = -1                  # необязательно; индекс устройства, -1/пропуск = системный по умолчанию
max_record_seconds = 10.0      # верхний лимит записи одной команды, секунды (1..30)

# ---- Детекция речи (VAD) ----
[vad]
silence_threshold = 0.01       # порог тишины в нормированных единицах 0.0..1.0 (RMS)
min_speech_duration = 0.5      # минимальная длительность речи, секунды (0..5)
max_silence_duration = 1.0     # пауза, завершающая сегмент, секунды (0.1..10)

# ---- Распознавание (этап 6) ----
[whisper]
model = "small"                # tiny|base|small|medium|large
device = "cpu"                 # "cpu" | "cuda"

# ---- Безопасность ----
[security]
# Целевая ОС задаётся пользователем явно, НЕ угадывается кодом.
target_os = "windows"          # "windows" | "linux" | "macos"
# dry_run = true: действия только журналируются (аргументы команды печатаются,
# subprocess НЕ вызывается). Безопасный режим по умолчанию.
dry_run = true

# Белый список приложений: имя команды -> путь к исполняемому файлу.
# Пустой словарь = запуск приложений запрещён.
app_whitelist = {}
# пример:
# app_whitelist = { notepad = "C:\\Windows\\System32\\notepad.exe" }

# Разрешённые директории для файловых операций. Пусто = файловые операции запрещены.
allowed_dirs = []
# пример:
# allowed_dirs = ["D:\\Data", "C:\\Users\\Public\\Documents"]

confirmation_required = true   # подтверждение опасных действий (закрытие, питание, удаление)
confirmation_timeout = 10.0    # таймаут подтверждения, секунды (2..60)

# ---- Синтез речи (этап 4) ----
[tts]
engine = "pyttsx3"
rate = 190                     # скорость речи 50..350
volume = 1.0                   # громкость 0.0..1.0
# voice_id = ""                # необязательный идентификатор голоса
# voice_ids = { ru = "...", de = "..." }  # явные голоса по языкам (SAPI id); иначе авто-подбор

# ---- Логирование ----
[logging]
level = "INFO"                 # DEBUG|INFO|WARNING|ERROR|CRITICAL
file = "voicecontrol.log"      # путь к файлу лога
max_bytes = 1000000            # ротация: максимальный размер файла, байт (>=1024)
backup_count = 3               # число ротированных копий (0..20)
