[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecontrol"
version = "0.1.0"
description = "Голосовой агент управления компьютером: локальные компоненты STT/TTS, безопасные действия ОС"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Этап 1: минимальные зависимости. Аудио (PyAudio), STT (faster-whisper)
# и TTS (pyttsx3) подключаются соответствующими этапами в optional-dependencies.
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
test = ["pytest>=8"]
audio = ["PyAudio"]
tts = ["pyttsx3"]
stt = ["faster-whisper"]
# Действия ОС этапа 3 (мини. для Windows: COM и громкость)
windows = ["pywin32", "pycaw"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
